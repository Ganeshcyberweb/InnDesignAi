# Pings the Supabase Postgres database daily so the free-tier project doesn't
# auto-pause after ~7 days of inactivity. Reads the connection string from a
# repository secret (SUPABASE_DB_URL) and runs a trivial SELECT NOW() query.
#
# Setup (one-time):
#   1. In GitHub, go to Settings → Secrets and variables → Actions.
#   2. Click "New repository secret".
#   3. Name:  SUPABASE_DB_URL
#      Value: your DIRECT_URL from .env (session-mode pooler, port 5432).
#             Should look like:
#               postgresql://postgres.<ref>:<password>@aws-...:5432/postgres
#             Percent-encode any special chars in the password (e.g. `$` -> `%24`).
#   4. Save. This workflow will start firing on the next scheduled run.
#
# Trigger it manually from the Actions tab (workflow_dispatch) after saving
# the secret to confirm the ping works.

name: Keep Supabase warm

on:
  schedule:
    # Daily at 03:17 UTC (~08:47 IST). The odd minute avoids the top-of-hour
    # crush on GitHub Actions schedulers.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: keep-supabase-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect secret (host + length only — password NEVER logged)
        env:
          URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is missing. Add it under Settings → Secrets and variables → Actions."
            {
              echo "### ❌ Secret missing"
              echo ""
              echo "The \`SUPABASE_DB_URL\` repository secret is not set."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Mask user:password before any logging.
          masked="$(printf '%s' "$URL" | sed -E 's|://[^@]+@|://***:***@|')"
          len=${#URL}
          scheme_ok="yes"
          case "$URL" in postgres://*|postgresql://*) ;; *) scheme_ok="no" ;; esac
          trailing_ws="no"
          if printf '%s' "$URL" | grep -q '[[:space:]]$'; then trailing_ws="yes"; fi
          # Extract host:port fragment (never touches user:password).
          hostport="$(printf '%s' "$URL" | sed -E 's|.*://[^@]+@||; s|/.*||')"

          echo "Length : $len chars"
          echo "URL    : $masked"
          echo "Scheme OK : $scheme_ok"
          echo "Trailing whitespace : $trailing_ws"
          echo "Host:port : $hostport"

          {
            echo "### 🔎 Secret inspection"
            echo ""
            echo "| Check | Value |"
            echo "|---|---|"
            echo "| URL length | $len chars |"
            echo "| Masked URL | \`$masked\` |"
            echo "| Host:port  | \`$hostport\` |"
            echo "| Scheme is postgres:// or postgresql:// | $scheme_ok |"
            echo "| Trailing whitespace / newline | $trailing_ws |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install psql (fallback if not preinstalled)
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      - name: Ping the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGCONNECT_TIMEOUT: "20"
          # Force SSL — Supabase requires it and this avoids ambiguity.
          PGSSLMODE: require
        run: |
          set -o pipefail
          if psql "$SUPABASE_DB_URL" -X -A -t \
              -c "SELECT NOW() AS pinged_at, current_database() AS db;" 2>&1 | tee /tmp/psql.log; then
            echo "Database pinged successfully at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            {
              echo ""
              echo "### ✅ Ping succeeded"
              echo ""
              echo '```'
              cat /tmp/psql.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            echo "::error::psql exited with code $code"
            echo "----- last lines of psql output -----"
            tail -n 20 /tmp/psql.log
            echo "-------------------------------------"
            {
              echo ""
              echo "### ❌ Ping failed (psql exit $code)"
              echo ""
              echo "**psql output:**"
              echo '```'
              tail -n 30 /tmp/psql.log
              echo '```'
              echo ""
              echo "**Most likely causes:**"
              echo "- Wrong URL — did you paste \`DATABASE_URL\` (port 6543) instead of \`DIRECT_URL\` (port 5432)?"
              echo "- Password not URL-encoded — \`\$\` must be \`%24\`, \`@\` must be \`%40\`, etc."
              echo "- Trailing newline in the secret value."
              echo "- Supabase project paused right now — resume it and re-run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi
